query ProgramBySlug($slug: ID!) {
  program(id: $slug, idType: SLUG) {
    title
    slug
    featuredImage {
      node {
        sourceUrl
        altText
        mediaDetails { width height }
      }
    }
    programFields {
      summary
      longDescription
      offeringType
      ageRange { min max }
      skillLevel
      duration
      priceFrom
      benefits
      membershipRequirements
      whatToBring
      instructors
      registrationSystem
      externalSchedule {
        activityCode
        sectionCodes
        deepLink
        nextStartDate
      }

      # Taxonomies are AcfTermNodeConnection => use nodes
      center      { nodes { name slug } }
      programArea { nodes { name slug } }
      audience    { nodes { name slug } }
      session     { nodes { name slug } }

      # Media gallery (ACF repeater; each row is AcfMediaItemConnectionEdge)
      gallery {
        photos {
          node {
            sourceUrl
            altText
            mediaDetails { width height }
          }
        }
      }

      # Attachments (ACF repeater; each row has file subfield)
      attachments {
        file {
          node {
            sourceUrl
            mediaItemUrl
            title
          }
        }
      }
    }
  }
}